# 우진물류 채용 사이트 - 전국 평균 유가 자동 갱신 + 사이트 배포
# 하는 일: 매일 2번(오전 9시 17분, 오후 4시 17분) 오피넷에서 전국 평균 유가를 받아 fuel.json을 만들고,
#          사이트를 다시 배포합니다. 파일을 올릴 때(push)도 사이트를 배포합니다.
# 미리 할 일: 1) 저장소 Settings > Secrets and variables > Actions 에 OPINET_KEY(오피넷 인증키) 등록
#             2) 저장소 Settings > Pages > Source 를 "GitHub Actions" 로 변경
name: 유가 갱신 및 사이트 배포

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 0 * * *'   # 매일 오전 9시 17분 (한국 시간)
    - cron: '17 7 * * *'   # 매일 오후 4시 17분 (한국 시간)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v7

      - name: 오피넷 전국 평균 유가 받기
        env:
          OPINET_KEY: ${{ secrets.OPINET_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          from datetime import datetime, timedelta, timezone

          key = os.environ.get('OPINET_KEY', '').strip()
          if not key:
              print('::warning::OPINET_KEY가 등록되지 않아 유가를 갱신하지 않았어요.')
              raise SystemExit(0)

          url = 'https://www.opinet.co.kr/api/avgAllPrice.do?out=json&certkey=' + key
          try:
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(req, timeout=30) as res:
                  data = json.loads(res.read().decode('utf-8', errors='replace'))
          except Exception as err:
              print(f'::warning::오피넷에서 유가를 받지 못했어요 ({type(err).__name__}). 이전 값을 그대로 둡니다.')
              raise SystemExit(0)

          def find_rows(node):
              if isinstance(node, list):
                  for item in node:
                      yield from find_rows(item)
              elif isinstance(node, dict):
                  upper = {str(k).upper(): v for k, v in node.items()}
                  if 'PRODCD' in upper:
                      yield upper
                  else:
                      for value in node.values():
                          yield from find_rows(value)

          def num(value):
              try:
                  return float(str(value).replace(',', '').replace('+', '').strip())
              except ValueError:
                  return None

          rows = {str(row.get('PRODCD')): row for row in find_rows(data)}
          diesel, gasoline = rows.get('D047'), rows.get('B027')
          if not diesel or not gasoline or num(diesel.get('PRICE')) is None or num(gasoline.get('PRICE')) is None:
              print('::warning::오피넷 응답에서 경유·휘발유 가격을 찾지 못했어요. 인증키를 확인해 주세요.')
              raise SystemExit(0)

          kst = timezone(timedelta(hours=9))
          trade = str(diesel.get('TRADE_DT') or gasoline.get('TRADE_DT') or '')
          if len(trade) == 8 and trade.isdigit():
              day = f'{trade[:4]}-{trade[4:6]}-{trade[6:8]}'
          else:
              day = datetime.now(kst).strftime('%Y-%m-%d')

          fuel = {
              'date': day,
              'diesel': round(num(diesel['PRICE']), 2),
              'dieselDiff': round(num(diesel.get('DIFF')) or 0, 2),
              'gasoline': round(num(gasoline['PRICE']), 2),
              'gasolineDiff': round(num(gasoline.get('DIFF')) or 0, 2),
              'source': '한국석유공사 오피넷 전국 주유소 평균가격',
              'updated': datetime.now(kst).strftime('%Y-%m-%d %H:%M'),
          }
          with open('fuel.json', 'w', encoding='utf-8') as f:
              json.dump(fuel, f, ensure_ascii=False, indent=2)
              f.write('\n')
          print('유가 갱신:', fuel)
          PY

      - name: 바뀐 유가 저장
        continue-on-error: true
        run: |
          if [ -f fuel.json ] && [ -n "$(git status --porcelain -- fuel.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add fuel.json
            git commit -m "전국 평균 유가 자동 갱신"
            git pull --rebase origin main
            git push
          fi

      - name: Pages 설정 확인
        uses: actions/configure-pages@v6

      - name: 사이트 파일 묶기
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: 사이트 배포
        id: deployment
        uses: actions/deploy-pages@v5
